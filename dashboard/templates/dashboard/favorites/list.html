<div id="favorites-container">
    {% if favorites %}
        <div id="favorites-header" class="flex items-center justify-between">
            <span class="flex items-center gap-x-2">
                <svg class="size-6">
                    <use href="#heart"></use>
                </svg>
                <h2 class="font-DanaMedium">محصولات مورد علاقه من</h2>
            </span>
            <button id="delete-all-favorites"
                    class="group shadow-xl text-sm md:text-base flex gap-x-1.5 items-center px-2 h-10 md:px-3 text-white bg-red-600 rounded-xl">
                <p>حذف همه</p>
                <span class="w-7 h-7 rounded-full bg-red-500 flex-center md:group-hover:-translate-x-1 transition-transform duration-300">
                    <svg class="size-5">
                        <use href="#trash"></use>
                    </svg>
                </span>
            </button>
        </div>
        <div id="favorites-list"
             class="grid grid-cols-1 xxs:grid-cols-2 xs:grid-cols-2 sm:grid-cols-2 xl:grid-cols-3 gap-3 xs:gap-2 sm:gap-4 mt-5 ">
            {% for fav in favorites %}
                {% include 'dashboard/favorites/item.html' %}
            {% endfor %}
        </div>
    {% else %}
        <section id="favorites-empty"
                 class="flex flex-col items-center justify-center shadow rounded-lg p-4 dark:bg-gray-800 bg-white gap-y-3 mt-5">
            <img class="max-w-60" src="/static/images/svg/empty-cart.svg" alt="svg">
            <h1 class="font-DanaDemiBold text-gray-700 dark:text-gray-300 text-2xl mt-2">
                لیست محصولات مورد علاقه شما خالی است
            </h1>
            <a class="flex items-center justify-center w-fit text-sky-500 mb-4" href="{% url 'product_list' %}">
                مشاهده فروشگاه
                <svg class="size-4 mb-0.5">
                    <use href="#chevron-left"></use>
                </svg>
            </a>
        </section>
    {% endif %}
</div>
