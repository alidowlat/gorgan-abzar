{% if results.products %}
    {% for item in results.products %}
        <li class="flex items-start gap-x-2">
            <a href="{{ item.get_absolute_url }}" class="flex items-center gap-x-2 flex-1">
                <img class="w-14 border border-gray-600/20 dark:border-gray-600 rounded-md"
                     src="{{ item.image.url }}"
                     alt="{{ item.slug }}">
                <p class="text-sm break-words text-center">{{ item.title }}</p>
            </a>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-store-icon">
                <path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/>
                <path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/>
                <path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/>
            </svg>
        </li>
    {% endfor %}
{% endif %}
{% if results.posts %}
    {% for item in results.posts %}
        <li class="flex items-start gap-x-2">
            <a href="{{ item.get_absolute_url }}" class="flex items-center gap-x-2 flex-1">
                <img class="w-14 border border-gray-600/20 dark:border-gray-600 rounded-md"
                     src="{{ item.image.url }}"
                     alt="{{ item.slug }}">
                <p class="text-sm break-words">{{ item.title }}</p>
            </a>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                 class="lucide lucide-newspaper-icon lucide-newspaper">
                <path d="M15 18h-5"/>
                <path d="M18 14h-8"/>
                <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/>
                <rect width="8" height="4" x="10" y="6" rx="1"/>
            </svg>
        </li>
    {% endfor %}
{% endif %}
